name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Pages deployments should finish once started; cancelling them can leave
  # the final deploy-pages handoff in a failed state during merge bursts.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install documentation tooling
        run: python -m pip install ".[docs]"
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Verify localized documentation trees
        run: |
          test -f site/docs/index.html
          test -f site/docs/zh/index.html
          test -f site/docs/zh/getting-started/index.html
          test -f site/docs/zh/mlx-backend/index.html
          test -f site/docs/hi/index.html
          test -f site/docs/hi/getting-started/index.html
          test -f site/docs/hi/mlx-backend/index.html
      - name: Bundle marketing site
        run: rsync -av docs/website/ site/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
